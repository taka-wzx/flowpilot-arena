      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  recovery-worker-quality:
    name: Recovery Worker lint, type-check, unit test, and replay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/recovery_worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: apps/recovery_worker/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate runtime-only local envelope key
        run: echo "RECOVERY_ENVELOPE_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')" >> "$GITHUB_ENV"
      - run: docker compose -f deploy/compose/compose.yaml config

  compose-smoke:
    name: W4 deterministic Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Generate runtime-only local envelope key
        run: echo "RECOVERY_ENVELOPE_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Build and start isolated W1-W4 stack
        run: docker compose -f deploy/compose/compose.yaml up --build -d --wait
      - name: Run fake-model smoke and verify independent grading
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile acceptance
          run --build --rm acceptance-smoke
      - name: Stop stack and remove synthetic volume
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v --remove-orphans

  vision-compose-smoke:
    name: W5 deterministic Vision-only Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Generate runtime-only local envelope key
        run: echo "RECOVERY_ENVELOPE_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Build and start isolated W1-W5 stack
        run: docker compose -f deploy/compose/compose.yaml up --build -d --wait
      - name: Run fake Vision-only smoke and verify independent grading
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile vision-acceptance
          run --build --rm vision-acceptance-smoke
      - name: Stop stack and remove synthetic volume
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v --remove-orphans

  hybrid-compose-smoke:
    name: W6 deterministic Hybrid Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Generate runtime-only local envelope key
        run: echo "RECOVERY_ENVELOPE_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Build and start isolated W1-W6 stack
        run: docker compose -f deploy/compose/compose.yaml up --build -d --wait
      - name: Run fake Hybrid smoke and verify independent grading
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile hybrid-acceptance
