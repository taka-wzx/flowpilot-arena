      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  vision-agent-quality:
    name: Vision Agent lint, type-check, and unit test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vision_agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: apps/vision_agent/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  hybrid-agent-quality:
    name: Hybrid Agent lint, type-check, and unit test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hybrid_agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: apps/hybrid_agent/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  planning-agent-quality:
    name: Planning Agent lint, type-check, and unit test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/planning_agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: apps/planning_agent/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  recovery-worker-quality:
    name: Recovery Worker lint, type-check, unit test, and replay
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/recovery_worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: apps/recovery_worker/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  workflow-worker-quality:
    name: Workflow Worker lint, type-check, and fenced unit test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workflow_worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: apps/workflow_worker/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  load-static-schema:
    name: W12 load static, schema, and checksum
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/load
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: tests/load/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy profile.py locustfile.py run_profile.py
      - run: uv run pytest
      - run: uv run python run_profile.py --static

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate runtime-only local envelope key
        run: echo "RECOVERY_ENVELOPE_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')" >> "$GITHUB_ENV"
      - run: docker compose -f deploy/compose/compose.yaml config

  compose-regression:
    name: W4-W12 deterministic Compose regression
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Generate runtime-only local envelope key
        run: echo "RECOVERY_ENVELOPE_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Build and start isolated W1-W12 stack once
        run: docker compose -f deploy/compose/compose.yaml up --build -d --wait
      - name: Verify Sandbox and Control Plane migrations
        run: |
          docker compose -f deploy/compose/compose.yaml exec -T sandbox-api alembic current
          docker compose -f deploy/compose/compose.yaml exec -T sandbox-api alembic check
          docker compose -f deploy/compose/compose.yaml exec -T control-api alembic current
          docker compose -f deploy/compose/compose.yaml exec -T control-api alembic check
      - name: Run W4 deterministic fake-model smoke
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile acceptance
          run --build --rm acceptance-smoke
      - name: Run W5 deterministic Vision-only smoke
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile vision-acceptance
          run --build --rm vision-acceptance-smoke
      - name: Run W6 deterministic Hybrid smoke
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile hybrid-acceptance
          run --build --rm hybrid-acceptance-smoke
      - name: Run W7 deterministic Planning smoke
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile planning-acceptance
          run --build --rm planning-acceptance-smoke
      - name: Run W8 deterministic Recovery smoke
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile recovery-acceptance
          run --build --rm recovery-acceptance-smoke
      - name: Restart Browser and Recovery Workers and verify health
        run: >-
          docker compose -f deploy/compose/compose.yaml restart browser-worker recovery-worker
      - run: docker compose -f deploy/compose/compose.yaml ps
      - name: Run W9 deterministic Context smoke
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile context-acceptance
          run --build --rm context-acceptance-smoke
      - name: Run W10 deterministic Identity smoke
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile identity-acceptance
          run --build --rm identity-acceptance-smoke
      - name: Run W11 deterministic Approval and Audit smoke
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile approval-acceptance
          run --build --rm approval-acceptance-smoke
      - name: Run W12 deterministic Production and Audit smoke
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile production-acceptance
          run --build --rm production-acceptance-smoke
      - name: Dump W12 Production diagnostics on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/compose.yaml ps -a
          docker compose -f deploy/compose/compose.yaml exec -T control-postgres psql -U flowpilot_control -d flowpilot_control -c "select organization_id, run_id, task_id, workflow_id, status, terminal_reason, fencing_token, receipt_reference, queued_at, started_at, finished_at from w12_production_runs order by accepted_at, run_id;"
          docker compose -f deploy/compose/compose.yaml exec -T control-postgres psql -U flowpilot_control -d flowpilot_control -At -F ',' -c "select workflow_id from w12_production_runs where status = 'failed' and workflow_id is not null order by accepted_at, run_id;" |
            while IFS=, read -r workflow_id; do
              if [ -n "$workflow_id" ]; then
                docker compose -f deploy/compose/compose.yaml run --rm --entrypoint temporal temporal-namespace --address temporal:7233 --namespace flowpilot-w8 workflow describe --workflow-id "$workflow_id" || true
              fi
            done
      - name: Restart Browser and Workflow Workers and verify health
        run: >-
          docker compose -f deploy/compose/compose.yaml restart browser-worker workflow-worker
      - run: docker compose -f deploy/compose/compose.yaml ps
      - name: Run W12 50-user protected Control API profile last
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile production-load
          run --build --rm production-load python run_profile.py --ci
      - run: docker compose -f deploy/compose/compose.yaml ps
      - name: Stop stack and remove all synthetic containers, networks, and volumes
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v --remove-orphans

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  required-ci-gate:
    name: Required CI gate
    if: always()
    needs:
      - backend-quality
      - frontend-quality
      - sandbox-backend-quality
      - sandbox-frontend-quality
      - browser-worker-quality
      - dom-agent-quality
      - vision-agent-quality
      - hybrid-agent-quality
      - planning-agent-quality
      - recovery-worker-quality
      - workflow-worker-quality
      - load-static-schema
      - compose-config
      - compose-regression
      - secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Verify the event-specific required job set
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          BACKEND_QUALITY: ${{ needs.backend-quality.result }}
          FRONTEND_QUALITY: ${{ needs.frontend-quality.result }}
          SANDBOX_BACKEND_QUALITY: ${{ needs.sandbox-backend-quality.result }}
          SANDBOX_FRONTEND_QUALITY: ${{ needs.sandbox-frontend-quality.result }}
          BROWSER_WORKER_QUALITY: ${{ needs.browser-worker-quality.result }}
          DOM_AGENT_QUALITY: ${{ needs.dom-agent-quality.result }}
          VISION_AGENT_QUALITY: ${{ needs.vision-agent-quality.result }}
          HYBRID_AGENT_QUALITY: ${{ needs.hybrid-agent-quality.result }}
          PLANNING_AGENT_QUALITY: ${{ needs.planning-agent-quality.result }}
          RECOVERY_WORKER_QUALITY: ${{ needs.recovery-worker-quality.result }}
          WORKFLOW_WORKER_QUALITY: ${{ needs.workflow-worker-quality.result }}
          LOAD_STATIC_SCHEMA: ${{ needs.load-static-schema.result }}
          COMPOSE_CONFIG: ${{ needs.compose-config.result }}
          COMPOSE_REGRESSION: ${{ needs.compose-regression.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail

          expected_quality=success
          expected_compose=success
          case "$EVENT_NAME" in
            push)
              expected_quality=skipped
              expected_compose=skipped
              ;;
            pull_request)
              if [[ "$ACTOR" == "dependabot[bot]" ]]; then
                expected_compose=skipped
              fi
              ;;
            workflow_dispatch)
              ;;
            *)
              echo "Unexpected event: $EVENT_NAME"
              exit 1
              ;;
          esac

          [[ "$COMPOSE_CONFIG" == success ]]
          [[ "$SECRET_SCAN" == success ]]
          [[ "$COMPOSE_REGRESSION" == "$expected_compose" ]]

          quality_results=(
            "$BACKEND_QUALITY"
            "$FRONTEND_QUALITY"
            "$SANDBOX_BACKEND_QUALITY"
            "$SANDBOX_FRONTEND_QUALITY"
            "$BROWSER_WORKER_QUALITY"
            "$DOM_AGENT_QUALITY"
            "$VISION_AGENT_QUALITY"
            "$HYBRID_AGENT_QUALITY"
            "$PLANNING_AGENT_QUALITY"
            "$RECOVERY_WORKER_QUALITY"
            "$WORKFLOW_WORKER_QUALITY"
            "$LOAD_STATIC_SCHEMA"
          )
          for result in "${quality_results[@]}"; do
            [[ "$result" == "$expected_quality" ]]
          done
