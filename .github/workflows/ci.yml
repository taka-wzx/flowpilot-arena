name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-quality:
    name: Backend lint, type-check, and unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control_api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: apps/control_api/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  frontend-quality:
    name: Frontend lint, type-check, unit test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control_web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control_web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  sandbox-backend-quality:
    name: Sandbox/Arena backend lint, type-check, and unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sandbox_api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: apps/sandbox_api/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: Verify packaged Arena task catalog
        run: >-
          uv run python -c "from flowpilot_sandbox_api.arena.catalog import get_catalog;
          catalog=get_catalog(); assert len(catalog.specs) == 10;
          print(catalog.canonical_checksum)"
      - name: Verify packaged W7 JML catalog and manifests
        run: >-
          uv run python -c "from flowpilot_sandbox_api.arena.jml.catalog import get_catalog;
          catalog=get_catalog(); assert len(catalog.templates) == 30;
          assert len(catalog.instances) == 90; print(catalog.summary().model_dump_json())"

  sandbox-frontend-quality:
    name: Sandbox frontend lint, type-check, unit test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sandbox_web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/sandbox_web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  browser-worker-quality:
