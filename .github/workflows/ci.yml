      - name: Stop stack and remove synthetic volume
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v --remove-orphans

  planning-compose-smoke:
    name: W7 deterministic Planning Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Generate runtime-only local envelope key
        run: echo "RECOVERY_ENVELOPE_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Build and start isolated W1-W7 stack
        run: docker compose -f deploy/compose/compose.yaml up --build -d --wait
      - name: Run fake Planning smoke and verify independent grading
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile planning-acceptance
          run --build --rm planning-acceptance-smoke
      - name: Stop stack and remove synthetic volume
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v --remove-orphans

  recovery-compose-smoke:
    name: W8 deterministic Recovery Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Generate runtime-only local envelope key
        run: echo "RECOVERY_ENVELOPE_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Build and start isolated W1-W8 stack
        run: docker compose -f deploy/compose/compose.yaml up --build -d --wait
      - name: Verify W8 receipt migration
        run: >-
          docker compose -f deploy/compose/compose.yaml exec -T sandbox-api
          alembic current
      - name: Run deterministic recovery, idempotency, fault, replan, and history smoke
        run: >-
          docker compose -f deploy/compose/compose.yaml --profile recovery-acceptance
          run --build --rm recovery-acceptance-smoke
      - name: Restart Browser and Recovery Workers and verify health
        run: >-
          docker compose -f deploy/compose/compose.yaml restart browser-worker recovery-worker
      - run: docker compose -f deploy/compose/compose.yaml ps
      - name: Stop stack and remove both synthetic volumes
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v --remove-orphans

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
