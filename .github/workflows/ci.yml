    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vision_agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: apps/vision_agent/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  hybrid-agent-quality:
    name: Hybrid Agent lint, type-check, and unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hybrid_agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: apps/hybrid_agent/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  planning-agent-quality:
    name: Planning Agent lint, type-check, and unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/planning_agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
