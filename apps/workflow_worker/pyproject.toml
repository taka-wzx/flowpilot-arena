[project]
name = "flowpilot-workflow-worker"
version = "0.1.0"
description = "W12 fenced durable dispatch worker for FlowPilot Arena"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cryptography==50.0.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "temporalio==1.30.0",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
  "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_workflow_worker"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", "uv.lock"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["flowpilot_workflow_worker"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src"]
files = ["src"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
