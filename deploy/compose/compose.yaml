name: flowpilot-arena-w1

services:
  control-api:
    build:
      context: ../../apps/control_api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  control-web:
    build:
      context: ../../apps/control_web
      dockerfile: Dockerfile
    depends_on:
      control-api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
