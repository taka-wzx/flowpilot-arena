name: flowpilot-arena-w12

services:
  control-api:
    build:
      context: ../../apps/control_api
      dockerfile: Dockerfile
    environment:
      CONTROL_DATABASE_URL: postgresql+psycopg://flowpilot_control:flowpilot_control_local_only@control-postgres:5432/flowpilot_control
      W10_SYNTHETIC_SEED: "1"
    depends_on:
      control-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - control-backend
      - control-database
      - identity
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/flowpilot:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  control-web:
    build:
      context: ../../apps/control_web
      dockerfile: Dockerfile
    depends_on:
      control-api:
        condition: service_healthy
    networks:
      - control-backend
    ports:
      - "127.0.0.1:5173:80"
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0750
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=0750
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  control-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowpilot_control
      POSTGRES_USER: flowpilot_control
      POSTGRES_PASSWORD: flowpilot_control_local_only
    networks:
      - control-database
    volumes:
      - control-postgres-data:/var/lib/postgresql/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/run/postgresql:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpilot_control -d flowpilot_control"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    command:
      - start
      - --optimized
      - --import-realm
      - --http-enabled=true
      - --hostname=http://127.0.0.1:8080
      - --hostname-backchannel-dynamic=true
      - --http-port=8080
    networks:
      - control-backend
      - identity
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/flowpilot-realm.json:/opt/keycloak/data/import/flowpilot-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/flowpilot/.well-known/openid-configuration HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowpilot_sandbox
      POSTGRES_USER: flowpilot
      POSTGRES_PASSWORD: flowpilot_local_only
    networks:
      - sandbox-backend
    volumes:
      - sandbox-postgres-data:/var/lib/postgresql/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/run/postgresql:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpilot -d flowpilot_sandbox"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  sandbox-api:
    build:
      context: ../../apps/sandbox_api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://flowpilot:flowpilot_local_only@postgres:5432/flowpilot_sandbox
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sandbox-backend
    ports:
      - "127.0.0.1:8001:8001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/flowpilot:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  sandbox-web:
    build:
      context: ../../apps/sandbox_web
      dockerfile: Dockerfile
    depends_on:
      sandbox-api:
        condition: service_healthy
    networks:
      - sandbox-backend
      - browser-sandbox
    ports:
      - "127.0.0.1:5174:80"
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0750
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=0750
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  browser-worker:
    build:
      context: ../../apps/browser_worker
      dockerfile: Dockerfile
    environment:
      SANDBOX_ORIGIN: http://sandbox-web
      MAX_ACTIONS: "50"
      MAX_NAVIGATIONS: "10"
      MAX_WAIT_MS: "5000"
      MAX_FILL_CHARS: "300"
      MAX_SESSION_SECONDS: "300"
      BROWSER_ACTION_TIMEOUT_MS: "20000"
      VISION_VIEWPORT_WIDTH: "960"
      VISION_VIEWPORT_HEIGHT: "540"
      MAX_VISION_SCREENSHOT_BYTES: "184320"
      MAX_VISION_SCREENSHOTS: "24"
      MAX_VISION_CAPTURE_MS: "3000"
      MAX_HYBRID_OBSERVATIONS: "24"
      MAX_HYBRID_DOM_OBSERVATION_BYTES: "262144"
    depends_on:
      sandbox-web:
        condition: service_healthy
    networks:
      - browser-sandbox
      - agent-worker
      - hybrid-worker
      - planning-worker
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    shm_size: 1gb
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /home/flowpilot-browser:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8002/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  dom-agent:
    build:
      context: ../../apps/dom_agent
      dockerfile: Dockerfile
    environment:
      BROWSER_WORKER_URL: http://browser-worker:8002
    depends_on:
      browser-worker:
        condition: service_healthy
    networks:
      - agent-worker
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/flowpilot-agent:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8003/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  vision-agent:
    build:
      context: ../../apps/vision_agent
      dockerfile: Dockerfile
    environment:
      BROWSER_WORKER_URL: http://browser-worker:8002
    depends_on:
      browser-worker:
        condition: service_healthy
    networks:
      - agent-worker
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/flowpilot-vision:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8004/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  hybrid-agent:
    build:
      context: ../../apps/hybrid_agent
      dockerfile: Dockerfile
    environment:
      BROWSER_WORKER_URL: http://browser-worker:8002
    depends_on:
      browser-worker:
        condition: service_healthy
    networks:
      - hybrid-worker
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/flowpilot-hybrid:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8005/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  planning-agent:
    build:
      context: ../../apps/planning_agent
      dockerfile: Dockerfile
    environment:
      BROWSER_WORKER_URL: http://browser-worker:8002
    depends_on:
      browser-worker:
        condition: service_healthy
    networks:
      - planning-worker
      - recovery-planning
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/flowpilot-planning:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8006/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  temporal-postgres:
    image: postgres:17.6-alpine
    user: "70:70"
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_w8_local_only
    networks:
      - temporal-db
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /run/postgresql:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  temporal-schema:
    build:
      context: ./temporal
      dockerfile: Dockerfile
    entrypoint: ["/opt/flowpilot-temporal/setup-postgres.sh"]
    environment:
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal_w8_local_only
      POSTGRES_SEEDS: temporal-postgres
      SQL_PASSWORD: temporal_w8_local_only
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks:
      - temporal-db
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

  temporal:
    build:
      context: ./temporal
      dockerfile: server.Dockerfile
    user: "1000:1000"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal_w8_local_only
      POSTGRES_SEEDS: temporal-postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    networks:
      - temporal-db
      - temporal-control
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  temporal-namespace:
    build:
      context: ./temporal
      dockerfile: Dockerfile
    entrypoint: ["/opt/flowpilot-temporal/create-namespace.sh"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: flowpilot-w8
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - temporal-control
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  workflow-worker:
    build:
      context: ../../apps/workflow_worker
      dockerfile: Dockerfile
    environment:
      CONTROL_DATABASE_URL: postgresql+psycopg://flowpilot_control:flowpilot_control_local_only@control-postgres:5432/flowpilot_control
      TEMPORAL_ADDRESS: temporal:7233
      W12_WORKER_INSTANCE_ID: worker_w12_compose_0001
      RECOVERY_ENVELOPE_KEY: ${RECOVERY_ENVELOPE_KEY:?RECOVERY_ENVELOPE_KEY must be runtime-injected}
    depends_on:
      control-api:
        condition: service_healthy
      control-postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    networks:
      - control-database
      - temporal-control
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /home/flowpilot-workflow:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "python", "-m", "flowpilot_workflow_worker.main", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  recovery-worker:
    build:
      context: ../../apps/recovery_worker
      dockerfile: Dockerfile
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      PLANNING_AGENT_URL: http://planning-agent:8006
      RECOVERY_ENVELOPE_KEY: ${RECOVERY_ENVELOPE_KEY:?RECOVERY_ENVELOPE_KEY must be runtime-injected}
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
      planning-agent:
        condition: service_healthy
    networks:
      - temporal-control
      - recovery-planning
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/flowpilot-recovery:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; from urllib.request import urlopen; urlopen('http://planning-agent:8006/healthz', timeout=3).read(); socket.create_connection(('temporal', 7233), 3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  real-agent:
    profiles:
      - real-acceptance
    build:
      context: ../../apps/dom_agent
      dockerfile: Dockerfile
    environment:
      BROWSER_WORKER_URL: http://browser-worker:8002
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
    depends_on:
      browser-worker:
        condition: service_healthy
    networks:
      - agent-worker
      - model-egress
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/flowpilot-agent:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; from urllib.request import urlopen; assert os.environ.get('ZHIPU_API_KEY'); urlopen('http://127.0.0.1:8003/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  acceptance-smoke:
    profiles:
      - acceptance
    build:
      context: ../../tests/integration
      dockerfile: Dockerfile
    environment:
      CONTROL_API_URL: http://control-api:8000
      SANDBOX_API_URL: http://sandbox-api:8001
      BROWSER_WORKER_URL: http://browser-worker:8002
      DOM_AGENT_URL: http://dom-agent:8003
      SANDBOX_WEB_URL: http://sandbox-web
    depends_on:
      control-api:
        condition: service_healthy
      sandbox-api:
        condition: service_healthy
      sandbox-web:
        condition: service_healthy
      browser-worker:
        condition: service_healthy
      dom-agent:
        condition: service_healthy
    networks:
      - control-backend
      - sandbox-backend
      - agent-worker
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  real-acceptance:
    profiles:
      - real-acceptance
    build:
      context: ../../tests/integration
      dockerfile: Dockerfile
    command: ["python", "w4_real_model_acceptance.py"]
    environment:
      CONTROL_API_URL: http://control-api:8000
      SANDBOX_API_URL: http://sandbox-api:8001
      REAL_AGENT_URL: http://real-agent:8003
    depends_on:
      control-api:
        condition: service_healthy
      sandbox-api:
        condition: service_healthy
      browser-worker:
        condition: service_healthy
      real-agent:
        condition: service_healthy
    networks:
      - control-backend
      - sandbox-backend
      - agent-worker
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  vision-acceptance-smoke:
    profiles:
      - vision-acceptance
    build:
      context: ../../tests/integration
      dockerfile: Dockerfile
    command: ["python", "w5_vision_compose_smoke.py"]
    environment:
      CONTROL_API_URL: http://control-api:8000
      SANDBOX_API_URL: http://sandbox-api:8001
      BROWSER_WORKER_URL: http://browser-worker:8002
      VISION_AGENT_URL: http://vision-agent:8004
      SANDBOX_WEB_URL: http://sandbox-web
    depends_on:
      control-api:
        condition: service_healthy
      sandbox-api:
        condition: service_healthy
      sandbox-web:
        condition: service_healthy
      browser-worker:
        condition: service_healthy
      vision-agent:
        condition: service_healthy
    networks:
      - control-backend
      - sandbox-backend
      - agent-worker
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  hybrid-acceptance-smoke:
    profiles:
      - hybrid-acceptance
    build:
      context: ../../tests/integration
      dockerfile: Dockerfile
    command: ["python", "w6_hybrid_compose_smoke.py"]
    environment:
      CONTROL_API_URL: http://control-api:8000
      SANDBOX_API_URL: http://sandbox-api:8001
      BROWSER_WORKER_URL: http://browser-worker:8002
      HYBRID_AGENT_URL: http://hybrid-agent:8005
      SANDBOX_WEB_URL: http://sandbox-web
    depends_on:
      control-api:
        condition: service_healthy
      sandbox-api:
        condition: service_healthy
      sandbox-web:
        condition: service_healthy
      browser-worker:
        condition: service_healthy
      hybrid-agent:
        condition: service_healthy
    networks:
      - control-backend
      - sandbox-backend
      - hybrid-worker
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  planning-acceptance-smoke:
    profiles:
      - planning-acceptance
    build:
      context: ../../tests/integration
      dockerfile: Dockerfile
    command: ["python", "w7_planning_compose_smoke.py"]
    environment:
      CONTROL_API_URL: http://control-api:8000
      SANDBOX_API_URL: http://sandbox-api:8001
      BROWSER_WORKER_URL: http://browser-worker:8002
      HYBRID_AGENT_URL: http://hybrid-agent:8005
      PLANNING_AGENT_URL: http://planning-agent:8006
      SANDBOX_WEB_URL: http://sandbox-web
    depends_on:
      control-api:
        condition: service_healthy
      sandbox-api:
        condition: service_healthy
      sandbox-web:
        condition: service_healthy
      browser-worker:
        condition: service_healthy
      hybrid-agent:
        condition: service_healthy
      planning-agent:
        condition: service_healthy
    networks:
      - control-backend
      - sandbox-backend
      - hybrid-worker
      - planning-worker
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
