{{- range $key, $component := .Values.components }}
{{- if $component.enabled }}
{{- $secret := default $.Values.global.existingSecret $component.existingSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowpilot.fullname" $ }}-{{ $component.name }}
  labels:
    {{- include "flowpilot.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.name }}
spec:
  replicas: {{ $.Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flowpilot.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flowpilot.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component.name }}
    spec:
      serviceAccountName: {{ include "flowpilot.serviceAccountName" $ }}
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
        {{- if or (eq $key "controlWeb") (eq $key "sandboxWeb") }}
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
        {{- end }}
      containers:
        - name: {{ $component.name }}
          image: {{ printf "%s@%s" $component.image.repository $component.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $component.port }}
              protocol: TCP
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- if or (eq $key "controlWeb") (eq $key "sandboxWeb") }}
          volumeMounts:
            - name: nginx-run
              mountPath: /run
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
          {{- end }}
          env:
            - name: FLOWPILOT_DEMO_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "flowpilot.fullname" $ }}-demo
                  key: FLOWPILOT_DEMO_MODE
            - name: FLOWPILOT_REAL_CALLS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "flowpilot.fullname" $ }}-demo
                  key: FLOWPILOT_REAL_CALLS
            - name: FLOWPILOT_REAL_COST_MICROUSD
              valueFrom:
                configMapKeyRef:
                  name: {{ include "flowpilot.fullname" $ }}-demo
                  key: FLOWPILOT_REAL_COST_MICROUSD
          {{- if $secret }}
          envFrom:
            - secretRef:
                name: {{ $secret | quote }}
                optional: false
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $component.healthPath | quote }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $component.healthPath | quote }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: {{ $component.healthPath | quote }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      {{- if or (eq $key "controlWeb") (eq $key "sandboxWeb") }}
      volumes:
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      {{- end }}
---
{{- end }}
{{- end }}
